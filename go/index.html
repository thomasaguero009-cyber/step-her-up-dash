<body>
<p>Un momento…</p>
<noscript><meta http-equiv="refresh" content="0;url=https://class.stepherup.com/step-her-up-c"></noscript>
<script>
(function () {
  // Pasarela de links con rastreo: anota de qué anuncio/cuenta viene la visita
  // (Worker /click, misma huella IP + navegador que luego usa la landing) y
  // sigue al funnel en ClickFunnels con las UTMs en el link.
  var DESTINO = "https://class.stepherup.com/step-her-up-c";
  var WORKER = "https://step-her-up-calendar.thomasaguero009.workers.dev";
  var CLAVES = ["utm_source", "utm_medium", "utm_campaign", "utm_content"];
  var params = new URLSearchParams(location.search);
  var q = new URLSearchParams();
  CLAVES.forEach(function (k) {
    var v = (params.get(k) || "").trim().slice(0, 150);
    if (v) q.set(k, v);
  });
  var destino = DESTINO + (q.toString() ? "?" + q.toString() : "");
  var hecho = false;
  function ir() { if (hecho) return; hecho = true; location.replace(destino); }
  if (!q.toString()) { ir(); return; }
  setTimeout(ir, 1500); // si el Worker tarda, no se hace esperar a la persona
  try {
    fetch(WORKER + "/click?" + q.toString(), { keepalive: true, mode: "cors" }).then(ir, ir);
  } catch (e) { ir(); }
})();
</script>
</body>
